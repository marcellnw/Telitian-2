<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="94" fill="none" stroke="#334155" stroke-width="4" />
  
  <!-- Guestbook & Donation Symbol -->
  <g transform="translate(106, 96)">
    <!-- Book base -->
    <rect x="20" y="30" width="260" height="290" rx="20" fill="#1e293b" stroke="url(#goldGrad)" stroke-width="8" />
    <path d="M 60 30 L 60 320" stroke="url(#goldGrad)" stroke-width="4" stroke-dasharray="6,6" />
    <!-- Book lines -->
    <line x1="90" y1="80" x2="240" y2="80" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" />
    <line x1="90" y1="120" x2="220" y2="120" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" />
    <line x1="90" y1="160" x2="200" y2="160" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" />
    <!-- Envelope with Rupiah Gold Coin -->
    <rect x="40" y="190" width="220" height="130" rx="14" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="6" />
    <path d="M 40 190 L 150 260 L 260 190" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linejoin="round" />
    
    <!-- Gold Coin / Stamp -->
    <circle cx="150" cy="255" r="36" fill="url(#goldGrad)" />
    <circle cx="150" cy="255" r="30" fill="none" stroke="#78350f" stroke-width="2" />
    <text x="150" y="265" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="#78350f" text-anchor="middle">Rp</text>
  </g>
</svg>
